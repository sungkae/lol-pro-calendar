name: Update schedule snapshot
on:
  schedule:
    - cron: "0 3 * * *"   # 매일 12:00 KST
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python fetch_data.py
      - name: Commit if changed
        run: |
          git config user.name "schedule-bot"
          git config user.email "actions@github.com"
          git add data.json
          git diff --cached --quiet || git commit -m "chore: refresh schedule snapshot"
          git push
